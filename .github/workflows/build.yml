name: build-installers

# 三个平台各自构建安装包（PyInstaller 不能交叉编译，必须各跑一遍）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            out: win-x64
          - os: macos-latest      # Apple Silicon；Intel Mac 请从源码运行
            arch: arm64
            out: mac-arm64
          - os: ubuntu-22.04
            arch: x86_64
            out: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 生成 macOS 图标（.icns）
        if: runner.os == 'macOS'
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s installer/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) installer/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o installer/icon.icns

      - name: 打包
        run: pyinstaller --noconfirm Transcriber.spec

      - name: 组装安装包（Linux AppImage）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils
          curl -L -o /tmp/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          mkdir -p pkg/Transcriber
          cp -r dist/Transcriber/* pkg/Transcriber/
          cp installer/icon.png pkg/icon.png
          cp installer/transcriber.desktop pkg/transcriber.desktop
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage \
            --appdir pkg/Transcriber --desktop-file pkg/transcriber.desktop \
            --icon-file pkg/icon.png --output appimage
          mv Transcriber-*.AppImage dist/Transcriber-${{ matrix.out }}.AppImage

      - name: 组装安装包（macOS dmg）
        if: runner.os == 'macOS'
        run: |
          STAGE=$(mktemp -d)
          cp -R dist/Transcriber.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "拖拽转录" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Transcriber-${{ matrix.out }}.dmg"
          # 未签名也要能打开：先 ad-hoc 签一遍，减少 Gatekeeper 报错面
          codesign --force --deep --sign - "dist/Transcriber-${{ matrix.out }}.dmg" || true

      - name: 组装安装包（Windows Setup.exe + zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss
          Compress-Archive -Path dist\Transcriber\* -DestinationPath `
            "dist\Transcriber-${{ matrix.out }}-portable.zip"

      - name: 产物
        uses: actions/upload-artifact@v4
        with:
          name: Transcriber-${{ matrix.out }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*Setup*.exe
            dist/*-portable.zip
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
